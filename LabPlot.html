<body>
  <a class="skip" href="#main">跳到实验内容</a>
  <div class="shell">
    <aside class="sidebar" id="sidebar" aria-label="实验册导航">
      <div class="brand"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 36 36"><path d="M6 26h24M8 23l7-12 6 6 6-10"/><circle cx="15" cy="11" r="2"/><circle cx="21" cy="17" r="2"/></svg></span><span>格物 <b>LabPlot</b></span></div>
      <div class="side-heading"><h2>我的实验册</h2><span id="book-count"></span></div>
      <button class="new-book" id="new-book"><i data-icon="plus"></i>新建实验</button>
      <nav id="library" aria-label="实验列表"></nav>
      <div class="side-bottom">
        <button class="side-import" id="import-book"><i data-icon="upload"></i>从 CSV 导入</button>
        <button class="side-import" id="backup-book"><i data-icon="download"></i>备份实验册</button>
        <button class="side-import" id="restore-book"><i data-icon="upload"></i>恢复实验册</button>
        <div class="workspace-info"><i data-icon="drive"></i><div><b>本地工作区</b><small>数据存储在当前浏览器</small></div></div>
      </div>
    </aside>
    <button class="scrim" id="scrim" aria-label="关闭实验册" hidden></button>
    <main id="main">
      <header class="topbar">
        <div class="crumb"><button id="menu" class="icon-button mobile-menu" aria-label="打开实验册" aria-controls="sidebar" aria-expanded="false"><i data-icon="menu"></i></button><i class="desk-crumb" data-icon="notebook"></i><span>实验册</span><span class="slash">/</span><strong>实验工作台</strong></div>
        <div id="save-status" role="status"></div>
      </header>
      <div class="content">
        <div id="warning" class="warning" role="alert" hidden></div>
        <section id="workspace" aria-label="当前实验">
          <div class="intro">
            <canvas id="starfield" aria-hidden="true"></canvas>
            <div class="intro-text"><div class="meta" id="meta"></div><h1 id="title"></h1><p id="description"></p></div>
            <button id="edit-book" class="button subtle"><i data-icon="sliders"></i>实验设置</button>
          </div>
          <div class="analysis-grid">
            <section class="plot-card card" aria-labelledby="plot-title">
              <header class="card-head"><div class="section-name"><span class="section-icon"><i data-icon="chart"></i></span><h2 id="plot-title">结果图表</h2></div>
                <div class="actions"><button class="icon-button" id="style-chart" title="图表样式" aria-label="图表样式"><i data-icon="sliders"></i></button><button class="button small" id="png"><i data-icon="download"></i>PNG</button></div>
              </header>
              <div class="plot-toolbar">
                <div class="segmented" role="group" aria-label="图表类型"><button data-type="bar"><i data-icon="bars"></i>柱状</button><button data-type="line"><i data-icon="line"></i>折线</button><button data-type="scatter"><i data-icon="scatter"></i>散点</button></div>
                <label class="select-wrap"><span class="sr-only">数据显示</span><select id="mode"><option value="delta">相对基线</option><option value="raw">原始数值</option></select></label>
              </div>
              <div class="plot" id="plot" aria-label="交互图表"></div>
              <div class="plot-footer"><div class="axis-controls"><label id="x-wrap" hidden>X 轴 <select id="x-axis"></select></label><label><span id="y-caption">指标</span> <select id="y-axis"></select></label></div><span class="plot-hint">点选数据标记以比较</span></div>
            </section>
            <section class="comparison card" aria-labelledby="comparison-title">
              <header class="card-head"><div class="section-name"><span class="section-icon"><i data-icon="compare"></i></span><h2 id="comparison-title">基线对照</h2></div><button class="copy-label" id="copy-result" title="复制当前指标的对照描述"><i data-icon="copy"></i>复制结论</button></header>
              <div class="compare-body">
                <div class="pair"><label>基线配置<select id="baseline"></select></label><label>对照配置<select id="selected"></select></label></div>
                <div id="comparison-readout" aria-live="polite"></div>
              </div>
            </section>
          </div>
          <section class="data-card card" aria-labelledby="table-title">
            <header class="card-head"><div class="section-name"><span class="section-icon"><i data-icon="table"></i></span><h2 id="table-title">实验数据</h2><span id="table-count" class="count"></span></div><div class="actions"><button class="button small" id="csv"><i data-icon="download"></i>CSV</button><button class="button small primary" id="add-row"><i data-icon="plus"></i>添加记录</button></div></header>
            <div class="matrix-toolbar"><div class="segmented" role="group" aria-label="数据视图"><button data-view="table"><i data-icon="table"></i>原始数据</button><button data-view="heat"><i data-icon="heat"></i>消融热图</button></div><span id="matrix-key" hidden><i></i>低于基线 <i></i>高于基线</span></div>
            <div id="raw-table" class="table-scroll"><table><thead id="thead"></thead><tbody id="tbody"></tbody></table></div>
            <div id="heat-table" class="table-scroll" hidden></div>
            <p class="table-help" id="table-help"></p>
          </section>
        </section>
        <section id="empty-library" class="card empty" hidden><h1>新建第一份实验记录</h1><p>给实验命名并设置指标，或从已有的 CSV 表格开始。</p><button class="button primary" id="first-book">新建实验</button></section>
      </div>
    </main>
  </div>
  <dialog id="dialog"><form id="dialog-form"><header class="dialog-head"><h2 id="dialog-title"></h2><button class="icon-button" type="button" data-close aria-label="关闭"><i data-icon="close"></i></button></header><div id="dialog-body"></div><p id="dialog-error" role="alert" hidden></p><footer class="dialog-foot"><button class="button" type="button" data-close>取消</button><button id="dialog-submit" class="button primary" type="submit">保存</button></footer></form></dialog>
  <div class="toast" id="toast" role="status" hidden></div>
  <noscript>请启用 JavaScript 以编辑数据、绘图和保存实验。</noscript>
<script>
/* Shared by the offline page and the Node test suite. */
(() => {
  'use strict';

  let sequence = 0;

  function uid() {
    if (globalThis.crypto?.randomUUID) return globalThis.crypto.randomUUID();
    sequence += 1;
    return 'lab-' + Date.now().toString(36) + '-' + sequence.toString(36) + '-' + Math.random().toString(36).slice(2, 10);
  }

  function experiment(id, title, columns, chart = {}) {
    return {
      id, title, description: '', columns, rows: [], baseline: '', selected: '',
      chart: {
        x: 0, y: 1, type: 'scatter', mode: 'raw',
        color: '#6387f1', grid: true, showValues: true, title: '', ...chart
      },
      source: null, modified: false
    };
  }

  function blank(title = '未命名实验') {
    return experiment(uid(), title, [{ name: '指标 X', unit: '' }, { name: '指标 Y', unit: '' }]);
  }

  function row(label = '', values = []) {
    return { id: uid(), label: String(label), values: values.map(value => String(value ?? '')) };
  }

  function samples() {
    const bert = experiment('bert', 'BERT 预训练任务消融', [
      { name: 'MNLI-m', unit: '%' }, { name: 'QNLI', unit: '%' },
      { name: 'MRPC', unit: '%' }, { name: 'SST-2', unit: '%' }, { name: 'SQuAD F1', unit: '分' }
    ], { type: 'bar', mode: 'delta' });
    bert.description = '比较四种配置在五项开发集任务上的表现。No NSP 移除下一句预测，LTR 改为从左到右建模，最后一组在微调时加入双向 LSTM。';
    bert.rows = [
      ['bert-base', 'BERT Base', '84.4', '88.4', '86.7', '92.7', '88.5'],
      ['no-nsp', 'No NSP', '83.9', '84.9', '86.5', '92.6', '87.9'],
      ['ltr', 'LTR + No NSP', '82.1', '84.3', '77.5', '92.1', '77.8'],
      ['bilstm', '+ BiLSTM', '82.1', '84.1', '75.7', '91.6', '84.9']
    ].map(([id, label, ...values]) => ({ id, label, values }));
    bert.baseline = 'bert-base';
    bert.selected = 'no-nsp';
    bert.source = { label: 'Devlin et al. · NAACL 2019 · 表 5', url: 'https://aclanthology.org/N19-1423.pdf#page=8' };

    const efficient = experiment('efficientnet', 'EfficientNet 模型缩放', [
      { name: '参数量', unit: 'M' }, { name: 'FLOPs', unit: 'B' },
      { name: 'Top-1', unit: '%' }, { name: 'Top-5', unit: '%' }
    ], { x: 0, y: 2 });
    efficient.description = '比较 EfficientNet B0–B7 在 ImageNet 上的准确率、参数量和计算量。M 表示百万参数，B 表示十亿次浮点运算。';
    efficient.rows = [
      ['5.3', '0.39', '76.3', '93.2'], ['7.8', '0.70', '78.8', '94.4'],
      ['9.2', '1.0', '79.8', '94.9'], ['12', '1.8', '81.1', '95.5'],
      ['19', '4.2', '82.6', '96.3'], ['30', '9.9', '83.3', '96.7'],
      ['43', '19', '84.0', '96.9'], ['66', '37', '84.4', '97.1']
    ].map((values, index) => ({ id: 'b' + index, label: 'B' + index, values }));
    efficient.baseline = 'b0';
    efficient.selected = 'b7';
    efficient.source = { label: 'Tan & Le · ICML 2019 · 表 2', url: 'https://proceedings.mlr.press/v97/tan19a/tan19a.pdf#page=6' };
    return [bert, efficient];
  }

  const decimal = /^[+-]?(?:\d+(?:\.\d*)?|\.\d+)(?:e[+-]?\d+)?$/i;

  function number(raw) {
    if (typeof raw === 'number') return Number.isFinite(raw) ? raw : null;
    if (typeof raw !== 'string') return null;
    const text = raw.trim();
    if (!decimal.test(text)) return null;
    const value = Number(text);
    return Number.isFinite(value) ? value : null;
  }

  function fmt(raw) {
    const value = number(raw);
    if (value === null) return '—';
    if (typeof raw === 'string' || Number.isInteger(value)) return String(value);
    // Only snap to a shorter decimal when it is within rounding noise of the original.
    const rounded = Number(value.toPrecision(12));
    const tolerance = Math.abs(value) * (512 * Number.EPSILON);
    return String(Math.abs(rounded - value) <= tolerance ? rounded : value);
  }

  function deltaUnit(unit) {
    return ['%', '％', '百分比'].includes(unit) ? '个百分点' : unit;
  }

  function difference(left, right) {
    const a = number(left), b = number(right);
    if (a === null || b === null) return null;
    if (a === b) return 0;
    // Align the two decimal measurements before subtracting close scores.
    function decimalParts(value) {
      const [mantissa, exponent = '0'] = String(value).split('e');
      const [integer, fraction = ''] = mantissa.split('.');
      return { digits: BigInt(integer + fraction), power: Number(exponent) - fraction.length };
    }
    const l = decimalParts(a), r = decimalParts(b), power = Math.min(l.power, r.power);
    const digits = l.digits * 10n ** BigInt(l.power - power) - r.digits * 10n ** BigInt(r.power - power);
    return number(String(digits) + 'e' + String(power));
  }

  function compare(exp, selectedId, baselineId) {
    const selected = exp.rows.find(item => item.id === selectedId);
    const baseline = exp.rows.find(item => item.id === baselineId);
    const forAxis = axis => difference(selected?.values[axis], baseline?.values[axis]);
    return { dx: forAxis(exp.chart.x), dy: forAxis(exp.chart.y) };
  }

  function points(exp) {
    const result = [];
    for (const { id, label, values } of exp.rows) {
      const x = number(values[exp.chart.x]);
      const y = number(values[exp.chart.y]);
      if (x !== null && y !== null) result.push({ id, label, x, y });
    }
    return result;
  }

  const headerPunctuation = /[\\[\]()（）]/g;
  const escapedHeaderPunctuation = /\\([\\[\]()（）])/g;

  function columnHeader(column) {
    const escape = value => value.replace(headerPunctuation, '\\$&');
    const name = escape(column.name);
    return column.unit ? name + ' [' + escape(column.unit) + ']' : name;
  }

  function parseColumn(input) {
    const text = input.trim();
    const unescape = value => value.trim().replace(escapedHeaderPunctuation, '$1');
    const closing = text.slice(-1);
    const opening = { ']': '[', ')': '(', '）': '（' }[closing];
    if (opening) {
      const starts = [];
      for (let i = 0; i < text.length; i += 1) {
        if (text[i] === '\\') {
          i += 1;
        } else if (text[i] === opening) {
          starts.push(i);
        } else if (text[i] === closing && starts.length) {
          const start = starts.pop();
          if (i === text.length - 1) {
            return { name: unescape(text.slice(0, start)), unit: unescape(text.slice(start + 1, i)) };
          }
        }
      }
    }
    return { name: unescape(text), unit: '' };
  }

  // Quoting alone does not stop spreadsheet software from interpreting textual cells as formulas.
  const formulaPrefix = /^(?:[\t\r\n]|\s*[=+@\-＝＋＠－])/u;

  function protectText(value) {
    return value.startsWith("'") || formulaPrefix.test(value) ? "'" + value : value;
  }

  function unprotectText(value) {
    if (value.startsWith("'")) {
      const rest = value.slice(1);
      if (rest.startsWith("'") || formulaPrefix.test(rest)) return rest;
    }
    return value;
  }

  function quoteCSV(value) {
    return /[",\r\n]/.test(value) ? '"' + value.replace(/"/g, '""') + '"' : value;
  }

  function csv(exp) {
    const headers = ['配置名称', ...exp.columns.map(column => protectText(columnHeader(column)))];
    const records = [headers];
    for (const { label, values } of exp.rows) {
      const cells = values.map(value => value.trim() && number(value) === null ? protectText(value) : value);
      records.push([protectText(label), ...cells]);
    }
    return '\uFEFF' + records.map(fields => fields.map(quoteCSV).join(',')).join('\r\n') + '\r\n';
  }

  function readCSV(input) {
    const text = input.replace(/^\uFEFF/, '');
    const records = [];
    let fields = [], field = '', quoted = false, closedQuote = false;
    let line = 1, startLine = 1;

    function finishRecord() {
      if (fields.length || field.trim() || closedQuote) {
        fields.push(field);
        records.push({ fields, line: startLine });
      }
      fields = [];
      field = '';
      closedQuote = false;
    }

    for (let i = 0; i < text.length; i += 1) {
      const char = text[i];
      if (quoted) {
        if (char === '"' && text[i + 1] === '"') {
          field += '"';
          i += 1;
        } else if (char === '"') {
          quoted = false;
          closedQuote = true;
        } else {
          field += char;
          if (char === '\n' || (char === '\r' && text[i + 1] !== '\n')) line += 1;
        }
      } else if (char === ',') {
        fields.push(field);
        field = '';
        closedQuote = false;
      } else if (char === '\n' || char === '\r') {
        finishRecord();
        if (char === '\r' && text[i + 1] === '\n') i += 1;
        line += 1;
        startLine = line;
      } else if (closedQuote) {
        throw new Error('第 ' + line + ' 行的结束引号后应接逗号或换行。');
      } else if (char === '"') {
        if (field.length) throw new Error('第 ' + line + ' 行的文本引号应位于字段开头。');
        quoted = true;
      } else {
        field += char;
      }
    }
    if (quoted) throw new Error('第 ' + startLine + ' 行起的字段缺少结束引号。');
    finishRecord();
    return records;
  }

  function fromCSV(text, title = '导入的实验') {
    if (typeof text !== 'string') throw new Error('请选择 UTF-8 编码的 CSV 文本文件。');
    const [header, ...records] = readCSV(text);
    if (!header || header.fields.length < 3 || !header.fields[0].trim()) {
      throw new Error('表头首列需填写配置名称，其后至少需要两列数值指标。');
    }
    const columns = header.fields.slice(1).map((value, index) => {
      const column = parseColumn(unprotectText(value));
      if (!column.name) throw new Error('表头第 ' + (index + 2) + ' 列缺少指标名称。');
      return column;
    });
    const rows = records.map(({ fields, line }) => {
      if (fields.length !== header.fields.length) {
        throw new Error('第 ' + line + ' 行有 ' + fields.length + ' 列，表头要求 ' + header.fields.length + ' 列。');
      }
      const values = fields.slice(1);
      values.forEach((value, index) => {
        if (value.trim() && number(value) === null) {
          throw new Error('第 ' + line + ' 行「' + columns[index].name + '」请填写有限的十进制数或留空。');
        }
      });
      return row(unprotectText(fields[0]), values);
    });
    const imported = experiment(uid(), title, columns);
    imported.rows = rows;
    imported.baseline = rows[0]?.id ?? '';
    imported.selected = (rows[1] ?? rows[0])?.id ?? '';
    imported.modified = true;
    return imported;
  }

  const isObject = value => value !== null && typeof value === 'object' && !Array.isArray(value);
  const isString = value => typeof value === 'string';
  const isId = value => isString(value) && value.trim().length > 0;

  function validSource(source) {
    if (source === null) return true;
    if (!isObject(source) || !isString(source.label) || !isString(source.url)) return false;
    try {
      const url = new URL(source.url);
      return url.protocol === 'http:' || url.protocol === 'https:';
    } catch {
      return false;
    }
  }

  function validExperiment(exp) {
    if (!isObject(exp) || !isId(exp.id) || !isString(exp.title) || !isString(exp.description) ||
        typeof exp.modified !== 'boolean' || !validSource(exp.source)) return false;
    if (!Array.isArray(exp.columns) || exp.columns.length < 2) return false;
    for (const column of exp.columns) {
      if (!isObject(column) || !isString(column.name) || !isString(column.unit)) return false;
    }
    const chart = exp.chart;
    const validAxis = index => Number.isInteger(index) && index >= 0 && index < exp.columns.length;
    if (!isObject(chart) || !validAxis(chart.x) || !validAxis(chart.y) ||
        !['bar', 'scatter', 'line'].includes(chart.type) || !['raw', 'delta'].includes(chart.mode) ||
        !isString(chart.color) || !/^#[\da-f]{6}$/i.test(chart.color) || !isString(chart.title) ||
        typeof chart.grid !== 'boolean' || typeof chart.showValues !== 'boolean') return false;
    if (!Array.isArray(exp.rows)) return false;
    const ids = new Set();
    for (const item of exp.rows) {
      if (!isObject(item) || !isId(item.id) || ids.has(item.id) || !isString(item.label) ||
          !Array.isArray(item.values) || item.values.length !== exp.columns.length) return false;
      for (const value of item.values) {
        if (!isString(value)) return false;
      }
      ids.add(item.id);
    }
    return [exp.baseline, exp.selected].every(id => id === '' || ids.has(id));
  }

  function validBook(book) {
    if (!isObject(book) || book.version !== 1 || !Array.isArray(book.experiments)) return false;
    const ids = new Set();
    for (const exp of book.experiments) {
      if (!validExperiment(exp) || ids.has(exp.id)) return false;
      ids.add(exp.id);
    }
    return true;
  }

  const api = { uid, samples, blank, row, number, fmt, deltaUnit, difference, compare, points, parseColumn, columnHeader, csv, fromCSV, validBook };
  globalThis.LabModel = api;
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
})();

<script>
/* Offline SVG and PNG rendering for the experiment notebook. */
(() => {
  'use strict';

  const FONT = "Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', 'PingFang SC', 'Microsoft YaHei', sans-serif";
  const INK = '#293d35';
  const MUTED = '#62746c';
  const AXIS = '#aebdb5';
  const GRID = '#dfe8e2';
  const OCHRE = '#92691e';
  const DEFAULT_COLOR = '#147859';
  const TYPES = { bar: '柱状图', line: '折线图', scatter: '散点图' };
  const finite = Number.isFinite;
  const compact = value => Number(value.toFixed(2));

  function escapeXML(value) {
    return String(value ?? '')
      .replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F\uD800-\uDFFF\uFFFE\uFFFF]/gu, '\uFFFD')
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&apos;');
  }

  function characterWidth(ch) {
    if (/\p{Mark}/u.test(ch)) return 0;
    if (/[^\u0000-\u024f]/u.test(ch)) return 1;
    if (/\s/.test(ch)) return 0.3;
    if (/[ilI1.,:;'|!]/.test(ch)) return 0.34;
    if (/[MW@mw]/.test(ch)) return 0.85;
    return 0.59;
  }

  function textWidth(value, fontSize) {
    let width = 0;
    for (const ch of String(value)) width += characterWidth(ch) * fontSize;
    return width;
  }

  function shorten(value, available, fontSize) {
    const str = String(value).replace(/\s+/g, ' ').trim();
    if (textWidth(str, fontSize) <= available) return str;
    let result = '', used = fontSize;
    for (const ch of str) {
      used += characterWidth(ch) * fontSize;
      if (used > available) break;
      result += ch;
    }
    return result + '…';
  }

  function wrapText(value, available, fontSize) {
    const result = [];
    for (const paragraph of String(value).split(/\r?\n/)) {
      let line = '', used = 0;
      for (const chunk of paragraph.match(/\s+|[A-Za-z0-9]+|[^\sA-Za-z0-9]/gu) || []) {
        const width = textWidth(chunk, fontSize);
        if (line && used + width > available) {
          result.push(line.trimEnd());
          line = ''; used = 0;
        }
        if (!line && /^\s+$/.test(chunk)) continue;
        if (width <= available) {
          line += chunk; used += width;
        } else {
          for (const ch of chunk) {
            const advance = characterWidth(ch) * fontSize;
            if (line && used + advance > available) {
              result.push(line); line = ''; used = 0;
            }
            line += ch; used += advance;
          }
        }
      }
      result.push(line.trimEnd());
    }
    return result;
  }

  function textAt(x, y, content, size = 11, fill = MUTED, anchor = 'start', weight = 450) {
    return `<text x="${compact(x)}" y="${compact(y)}" font-size="${size}" font-weight="${weight}" text-anchor="${anchor}" fill="${fill}">${escapeXML(content)}</text>`;
  }

  function rule(x1, y1, x2, y2, stroke, extra = '') {
    return `<line x1="${compact(x1)}" y1="${compact(y1)}" x2="${compact(x2)}" y2="${compact(y2)}" stroke="${stroke}" ${extra}/>`;
  }

  function palette(value) {
    let hex = String(value || '');
    if (/^#[a-f0-9]{3}$/i.test(hex)) hex = '#' + [...hex.slice(1)].map(ch => ch + ch).join('');
    return /^#[a-f0-9]{6}$/i.test(hex) ? hex.toLowerCase() : DEFAULT_COLOR;
  }

  function mix(color, other, amount) {
    return '#' + [1, 3, 5].map(i => {
      const a = parseInt(color.slice(i, i + 2), 16), b = parseInt(other.slice(i, i + 2), 16);
      return Math.round(a * (1 - amount) + b * amount).toString(16).padStart(2, '0');
    }).join('');
  }

  function numberLabel(value, precision = 6) {
    if (value === 0) return '0';
    const magnitude = Math.abs(value);
    if (magnitude < 0.001 || magnitude >= 1e6) {
      const [mantissa, exponent] = value.toExponential(precision - 1).split('e');
      return `${Number(mantissa)}e${Number(exponent)}`.replace(/-/g, '−');
    }
    return String(Number(value.toPrecision(precision))).replace(/-/g, '−');
  }

  // Work in units near the data's magnitude so spans crossing ±1e308 stay finite.
  function scaleFor(values, tickCount, includeZero) {
    let low = includeZero ? 0 : Infinity, high = includeZero ? 0 : -Infinity;
    for (const v of values) if (finite(v)) { low = Math.min(low, v); high = Math.max(high, v); }
    const magnitude = Math.max(Math.abs(low), Math.abs(high));
    const unit = magnitude === 0 ? 1 : Math.pow(10, Math.floor(Math.log10(magnitude))) || Number.MIN_VALUE;
    low /= unit; high /= unit;
    const minStep = Number.MIN_VALUE / unit;
    if (high === low) {
      const pad = low === 0 ? 1 : Math.max(Math.abs(low) * 0.08, minStep);
      if (!includeZero || low < 0) low -= pad;
      if (!includeZero || high >= 0) high += pad;
    } else if (!includeZero) {
      // Keep measured points away from the frame while preserving tight metric ranges.
      const pad = (high - low) * 0.035;
      low -= pad; high += pad;
    }
    const rough = Math.max((high - low) / tickCount, minStep, Number.EPSILON * Math.max(Math.abs(low), Math.abs(high)) * 4);
    const power = 10 ** Math.floor(Math.log10(rough));
    const multiple = rough / power;
    const nice = [1, 2, 2.5, 5, 10].find(n => n >= multiple - 1e-9) || 10;
    const step = nice * power;
    let first = Math.floor(low / step + 1e-9), last = Math.ceil(high / step - 1e-9);
    if (first === last) { first--; last++; }
    const lower = first * step, upper = last * step;
    const ticks = [];
    for (let i = 0; i <= last - first; i++) {
      const scaled = (first + i) * step, value = scaled * unit;
      if (!finite(value)) continue;
      const precision = Math.min(17, Math.max(5, Math.ceil(Math.log10(Math.abs(scaled) / step || 1)) + 2));
      ticks.push({ fraction: (scaled - lower) / (upper - lower), label: numberLabel(value, precision), zero: scaled === 0 });
    }
    return { ticks, fraction: value => Math.max(0, Math.min(1, (value / unit - lower) / (upper - lower))) };
  }

  function normalize(options) {
    const o = options || {};
    const type = Object.hasOwn(TYPES, o.type) ? o.type : 'bar';
    const mode = o.mode === 'delta' ? 'delta' : 'raw';
    let yLabel = String(o.yLabel || 'Y 指标');
    if (mode === 'delta') yLabel = yLabel.replace(/[%％]|百分比/g, '百分点');
    const source = String(o.source || '').trim();
    const points = (Array.isArray(o.points) ? o.points : []).map((p, i) => ({
      id: String(p?.id ?? i), label: String(p?.label || `记录 ${i + 1}`),
      x: p?.x, y: p?.y, index: i,
    }));
    const baselineId = o.baselineId == null ? null : String(o.baselineId);
    const baselineLabel = String(o.baselineLabel || points.find(p => p.id === baselineId)?.label || '');
    return {
      type, mode, points, baselineId, baselineLabel, yLabel, source,
      xLabel: String(o.xLabel || (type === 'scatter' ? 'X 指标' : '实验配置')),
      selectedId: o.selectedId == null ? null : String(o.selectedId),
      baselineY: finite(o.baselineY) ? o.baselineY : null,
      color: palette(o.color), title: String(o.title || '实验指标对比'),
      grid: o.grid !== false, showValues: Boolean(o.showValues),
    };
  }

  function valueLabel(o, value) {
    return (o.mode === 'delta' && value > 0 ? '+' : '') + numberLabel(value);
  }

  function baselineText(o) {
    if (o.baselineY === null && !o.baselineLabel) return '';
    const name = o.baselineLabel ? `基线 · ${o.baselineLabel}` : '基线';
    return o.baselineY === null ? `${name}（缺测）` : `${name}  ${valueLabel(o, o.baselineY)}`;
  }

  function categoryLabels(o, box, slot, font) {
    const n = o.points.length;
    let widest = 0;
    for (const p of o.points) widest = Math.max(widest, Math.min(82, textWidth(p.label, font)));
    const stride = Math.max(1, Math.ceil((widest + 12) / slot));
    const budget = Math.min(92, slot * stride - 7);
    const selected = o.points.findIndex(p => p.id === o.selectedId);
    const indices = new Set([selected, 0, n - 1]);
    for (let i = 0; i < n; i += stride) indices.add(i);
    const occupied = [], output = [];
    for (const i of indices) {
      if (i < 0) continue;
      const x = box.left + (i + 0.5) * slot;
      const label = shorten(o.points[i].label, budget, font);
      const width = textWidth(label, font);
      const center = Math.max(width / 2 + 3, Math.min(box.width - width / 2 - 3, x));
      const a = center - width / 2 - 2, b = center + width / 2 + 2;
      if (occupied.some(r => a < r[1] && b > r[0])) continue;
      occupied.push([a, b]);
      output.push(textAt(center, box.bottom + 18, label, font, i === selected ? INK : MUTED, 'middle', i === selected ? 650 : 450));
    }
    return output.join('');
  }

  function valueLabels(o, plotted, box, font, labelColor) {
    const occupied = [], output = [];
    const priority = p => p.id === o.selectedId ? 0 : p.id === o.baselineId ? 1 : 2;
    const ordered = [...plotted].sort((a, b) => priority(a) - priority(b));
    for (const p of ordered) {
      const value = valueLabel(o, p.y), width = textWidth(value, font) + 6;
      const up = { x: p.cx, y: p.cy - 8 }, down = { x: p.cx, y: p.cy + font + 8 };
      const axisSide = o.type === 'bar' && p.y < 0 ? [down, up] : [up, down];
      const candidates = o.type === 'bar' ? axisSide : [...axisSide, { x: p.cx + 11 + width / 2, y: p.cy + 4 }, { x: p.cx - 11 - width / 2, y: p.cy + 4 }];
      for (const position of candidates) {
        const x = Math.max(box.left + width / 2, Math.min(box.right - width / 2, position.x));
        const y = position.y;
        if (y - font < box.top - 10 || y > box.bottom + 3) continue;
        const rect = { l: x - width / 2, r: x + width / 2, t: y - font, b: y + 3 };
        if (occupied.some(b => rect.l < b.r && rect.r > b.l && rect.t < b.b && rect.b > b.t)) continue;
        occupied.push(rect);
        output.push(textAt(x, y, value, font, p.id === o.selectedId ? labelColor : MUTED, 'middle', p.id === o.selectedId ? 700 : 500));
        break;
      }
    }
    return `<g pointer-events="none">${output.join('')}</g>`;
  }

  function emptyPlot(o, width, height) {
    const x = width / 2, y = height / 2 - 15;
    let help = o.type === 'scatter' ? '请在同一条记录中填写 X、Y 指标。' : '请在记录中填写所选 Y 指标的数值。';
    if (o.mode === 'delta' && o.baselineY === null) help = '请设置有 Y 指标数值的基线记录。';
    return `<g aria-hidden="true" fill="none" stroke="#a9bdb2" stroke-width="1.7" stroke-linecap="round">${rule(x - 13, y + 4, x + 13, y + 4, '#a9bdb2')}${rule(x - 8, y, x - 8, y - 7, '#a9bdb2')}${rule(x, y, x, y - 14, '#87a696')}${rule(x + 8, y, x + 8, y - 10, '#a9bdb2')}</g>` +
      textAt(x, y + 29, '暂无可绘制的数据', 14, INK, 'middle', 650) + textAt(x, y + 51, help, 11, MUTED, 'middle');
  }

  function plot(o, width, height, report = false) {
    const valid = o.points.filter(p => finite(p.y) && (o.type !== 'scatter' || finite(p.x)));
    if (!valid.length) return emptyPlot(o, width, height);
    const compactLayout = width < 440;
    const font = compactLayout ? 10 : 11.5;
    const yValues = valid.map(p => p.y);
    if (o.baselineY !== null) yValues.push(o.baselineY);
    const sy = scaleFor(yValues, height < 206 ? 3 : height < 285 ? 4 : 5, o.type === 'bar');
    let tickWidth = 12;
    for (const tick of sy.ticks) tickWidth = Math.max(tickWidth, textWidth(tick.label, font));
    const box = {
      width, left: Math.min(Math.ceil(tickWidth) + 15, width * 0.55), right: width - (compactLayout ? 12 : 18),
      top: height < 180 ? 28 : 34, bottom: height - (height < 180 ? 43 : 51),
    };
    const plotWidth = box.right - box.left, plotHeight = box.bottom - box.top;
    const yAt = fraction => box.bottom - fraction * plotHeight;
    const xAt = fraction => box.left + fraction * plotWidth;
    const sx = o.type === 'scatter' ? scaleFor(valid.map(p => p.x), width < 400 ? 3 : width < 680 ? 6 : 8, false) : null;
    const slot = plotWidth / o.points.length;
    const plotted = valid.map(p => ({ ...p, cx: sx ? xAt(sx.fraction(p.x)) : box.left + (p.index + 0.5) * slot, cy: yAt(sy.fraction(p.y)) }));
    const parts = [], baseline = baselineText(o);
    const headerY = height < 180 ? 12 : 15;
    let yTitleBudget = width - 14;
    if (baseline && !report) {
      const cap = Math.min(180, width * 0.40), caption = shorten(baseline, cap - 21, font);
      const captionWidth = textWidth(caption, font), end = width - 6, start = end - captionWidth;
      if (o.baselineY !== null) parts.push(rule(start - 21, headerY - 4, start - 5, headerY - 4, OCHRE, 'stroke-dasharray="4 3" stroke-width="1.35"'));
      parts.push(textAt(end, headerY, caption, font, OCHRE, 'end', 550));
      yTitleBudget = start - 29;
    }
    parts.push(textAt(3, headerY, shorten(o.yLabel, yTitleBudget, font), font, INK, 'start', 600));
    for (const tick of sy.ticks) {
      const y = yAt(tick.fraction);
      if (o.grid && tick.fraction > 0.00001) parts.push(rule(box.left, y, box.right, y, GRID, 'stroke-width="1" stroke-dasharray="3 4"'));
      parts.push(textAt(box.left - 8, y + font * 0.34, tick.label, font, MUTED, 'end'));
    }
    if (sx) {
      for (const tick of sx.ticks) {
        const x = xAt(tick.fraction), widthOfText = textWidth(tick.label, font);
        if (o.grid && tick.fraction > 0 && tick.fraction < 1) parts.push(rule(x, box.top, x, box.bottom, GRID, 'stroke-width="0.8" stroke-dasharray="3 4"'));
        parts.push(rule(x, box.bottom, x, box.bottom + 4, AXIS), textAt(Math.min(width - widthOfText / 2 - 2, Math.max(widthOfText / 2 + 2, x)), box.bottom + 18, tick.label, font, MUTED, 'middle'));
      }
    } else {
      parts.push(categoryLabels(o, box, slot, font));
    }
    parts.push(rule(box.left, box.bottom, box.right, box.bottom, AXIS, 'stroke-width="1"'));
    parts.push(textAt((box.left + box.right) / 2, height - 7, shorten(o.xLabel, plotWidth, font), font, INK, 'middle', 550));
    const baselineLine = o.baselineY === null ? '' : rule(box.left, yAt(sy.fraction(o.baselineY)), box.right, yAt(sy.fraction(o.baselineY)), OCHRE, 'stroke-width="1.35" stroke-dasharray="6 4" pointer-events="none"');
    if (o.type !== 'bar') parts.push(baselineLine);
    if (o.type === 'line') {
      let previous = -2, path = '';
      for (const p of plotted) {
        path += `${p.index === previous + 1 ? 'L' : 'M'}${compact(p.cx)},${compact(p.cy)} `;
        previous = p.index;
      }
      parts.push(`<path d="${path.trim()}" fill="none" stroke="${o.color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`);
    }
    const zeroY = o.type === 'bar' ? yAt(sy.fraction(0)) : 0;
    if (o.type === 'bar' && zeroY > box.top + 1 && zeroY < box.bottom - 1) parts.push(rule(box.left, zeroY, box.right, zeroY, AXIS, 'stroke-width="1.15"'));
    const barWidth = Math.min(54, slot * 0.61);
    const hasSelection = plotted.some(p => p.id === o.selectedId);
    const mutedColor = mix(o.color, '#ffffff', 0.37);
    const pointStroke = mix(o.color, '#203d31', 0.34);
    const lightStroke = mix(o.color, '#77877d', 0.35);
    const selectedColor = mix(o.color, '#102f23', 0.36);
    const radius = o.type === 'scatter' ? 4.7 : 4.1;
    // Draw the selected dot last so tied scatter coordinates still show the selection.
    const order = hasSelection ? [...plotted.filter(p => p.id !== o.selectedId), ...plotted.filter(p => p.id === o.selectedId)] : plotted;
    for (const p of order) {
      const selected = p.id === o.selectedId, active = selected || !hasSelection;
      const fill = active ? o.color : mutedColor;
      const summary = `${p.label} · ${o.type === 'scatter' ? o.xLabel + ' ' + numberLabel(p.x) + ' · ' : ''}${o.yLabel} ${valueLabel(o, p.y)}`;
      const attrs = report ? '' : ` data-row="${escapeXML(p.id)}" role="button" tabindex="0" cursor="pointer" aria-label="${escapeXML(summary)}"`;
      parts.push(`<g${attrs}><title>${escapeXML(summary)}</title>`);
      if (o.type === 'bar') {
        const top = Math.min(p.cy, zeroY), barHeight = Math.abs(zeroY - p.cy);
        if (!report) {
          const hitWidth = Math.min(slot - Math.min(0.2, slot / 8), Math.max(18, barWidth));
          const hitTop = Math.max(box.top - 3, top - 3), hitBottom = Math.min(box.bottom + 3, Math.max(p.cy, zeroY) + 3);
          parts.push(`<rect x="${compact(p.cx - hitWidth / 2)}" y="${compact(hitTop)}" width="${compact(hitWidth)}" height="${compact(Math.max(6, hitBottom - hitTop))}" fill="transparent"/>`);
        }
        if (barHeight < 0.02) parts.push(rule(p.cx - barWidth / 2, zeroY, p.cx + barWidth / 2, zeroY, active ? pointStroke : lightStroke, 'stroke-width="2"'));
        else parts.push(`<rect x="${compact(p.cx - barWidth / 2)}" y="${compact(top)}" width="${compact(barWidth)}" height="${compact(barHeight)}" rx="${compact(Math.min(3, barWidth / 6, barHeight / 3))}" fill="${fill}" stroke="${active ? pointStroke : lightStroke}" stroke-width="0.65"/>`);
      } else {
        if (!report) parts.push(`<circle cx="${compact(p.cx)}" cy="${compact(p.cy)}" r="10" fill="transparent"/>`);
        if (selected) parts.push(`<circle cx="${compact(p.cx)}" cy="${compact(p.cy)}" r="${radius + 4}" fill="${mix(o.color, '#ffffff', 0.82)}" stroke="${mix(o.color, '#ffffff', 0.5)}" stroke-width="0.8"/>`);
        parts.push(`<circle cx="${compact(p.cx)}" cy="${compact(p.cy)}" r="${selected ? radius + 0.7 : radius}" fill="${fill}" stroke="${o.type === 'line' ? '#ffffff' : (active ? pointStroke : lightStroke)}" stroke-width="${o.type === 'line' ? 1.6 : 0.95}"/>`);
      }
      parts.push('</g>');
    }
    if (o.type === 'bar') parts.push(baselineLine);
    if (o.showValues) parts.push(valueLabels(o, plotted, box, compactLayout ? 10 : 11.5, selectedColor));
    return parts.join('');
  }

  function svg(options = {}) {
    const o = normalize(options);
    const width = finite(options.width) ? Math.max(180, Math.min(8192, options.width)) : 720;
    const height = finite(options.height) ? Math.max(140, Math.min(8192, options.height)) : 295;
    const description = [TYPES[o.type], o.xLabel, o.yLabel, baselineText(o), o.source].filter(Boolean).join(' · ');
    return `<svg xmlns="http://www.w3.org/2000/svg" width="${compact(width)}" height="${compact(height)}" viewBox="0 0 ${compact(width)} ${compact(height)}" role="group" aria-label="${escapeXML(o.title)}" font-family="${FONT}" fill="${INK}"><title>${escapeXML(o.title)}</title><desc>${escapeXML(description)}</desc><rect width="100%" height="100%" fill="#ffffff"/>${plot(o, width, height)}</svg>`;
  }

  function reportFigure(o) {
    const width = 1000, pad = 35, inside = width - 2 * pad, scale = 1.6;
    const titleLines = wrapText(o.title, inside, 25);
    const sourceLines = wrapText(o.source || '未填写来源', inside - 76, 11.5);
    const legendY = 67 + (titleLines.length - 1) * 32 + 27;
    const plotTop = legendY + 22, plotHeight = 358;
    const sourceY = plotTop + plotHeight + 35;
    const logicalHeight = Math.max(562.5, sourceY + 16 * (sourceLines.length - 1) + 25);
    const pixelHeight = Math.ceil(logicalHeight * scale);
    const parts = [
      `<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="${pixelHeight}" viewBox="0 0 ${width} ${pixelHeight / scale}" font-family="${FONT}" fill="${INK}">`,
      `<rect width="100%" height="100%" fill="#ffffff"/>`,
      textAt(pad, 27, '格物 LabPlot', 12, DEFAULT_COLOR, 'start', 700),
      textAt(width - pad, 27, TYPES[o.type], 11.5, MUTED, 'end', 500),
    ];
    titleLines.forEach((line, i) => parts.push(textAt(pad, 67 + i * 32, line, 25, INK, 'start', 680)));
    const selected = o.points.find(p => p.id === o.selectedId);
    const series = selected ? `当前记录 · ${selected.label}` : o.yLabel;
    const legend = shorten(series, 350, 12);
    parts.push(`<circle cx="${pad + 5}" cy="${legendY - 4}" r="4.5" fill="${o.color}" stroke="${mix(o.color, INK, 0.4)}" stroke-width="1"/>`, textAt(pad + 17, legendY, legend, 12, INK));
    const baseline = baselineText(o);
    if (baseline) {
      const start = pad + textWidth(legend, 12) + 47;
      if (o.baselineY !== null) parts.push(rule(start, legendY - 4, start + 22, legendY - 4, OCHRE, 'stroke-width="1.6" stroke-dasharray="6 4"'));
      parts.push(textAt(start + 29, legendY, shorten(baseline, width - pad - start - 29, 12), 12, OCHRE));
    }
    parts.push(`<g transform="translate(${pad} ${plotTop})">${plot(o, inside, plotHeight, true)}</g>`, rule(pad, sourceY - 19, width - pad, sourceY - 19, GRID), textAt(pad, sourceY, '数据来源', 11.5, INK, 'start', 650));
    sourceLines.forEach((line, i) => parts.push(textAt(pad + 76, sourceY + i * 16, line, 11.5, MUTED)));
    parts.push('</svg>');
    return { markup: parts.join(''), width: 1600, height: pixelHeight };
  }

  async function png(options = {}) {
    const figure = reportFigure(normalize(options));
    const image = new Image();
    const objectURL = URL.createObjectURL(new Blob([figure.markup], { type: 'image/svg+xml;charset=utf-8' }));
    try {
      await new Promise((resolve, reject) => {
        image.onload = resolve;
        image.onerror = () => reject(new Error('图表图像加载失败，请重新导出。'));
        image.src = objectURL;
      });

      const context = canvas.getContext('2d');
      if (!context) throw new Error('浏览器无法创建 PNG 画布。');
      context.drawImage(image, 0, 0, canvas.width, canvas.height);
      return await new Promise((resolve, reject) => canvas.toBlob(blob => blob ? resolve(blob) : reject(new Error('PNG 导出失败，请重试。')), 'image/png'));
    } finally {
      URL.revokeObjectURL(objectURL);
    }
  }

  const charts = Object.freeze({ svg, png });
  globalThis.LabCharts = charts;
  if (typeof module !== 'undefined' && module.exports) module.exports = charts;
})();

<script>
/* A deterministic spiral galaxy. Drawing is limited to the visible header. */
(() => {
  'use strict';
  const canvas = document.getElementById('starfield');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  if (!ctx) return;
  const header = canvas.parentElement;
  const motion = matchMedia('(prefers-reduced-motion: reduce)');
  let seed = 921938;
  const random = () => ((seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0) / 4294967296);
  const tau = Math.PI * 2;
  const stars = Array.from({length:1900}, (_, i) => {
    const radius = Math.pow(random(), 0.68);
    const spread = (random()+random()+random()-1.5) * (0.12+radius*0.39);
    return {
      radius, angle: (i%3)*tau/3 + 4.8*Math.log(0.25+radius) + spread,
      lift: (random()+random()-1) * (0.017+radius*0.05),
      size: 0.36+random()**3*1.45, glow:0.25+random()*0.73,
      color: Math.floor(random()*5), phase:random()*tau
    };
  });
  const sky=Array.from({length:105},()=>({x:random(),y:random(),r:0.35+random()**3*1.05,a:0.15+random()*.64}));
  const colors=['#a4bcff','#7fe8ff','#d1b2ff','#ffffff','#6a83ff'];
  let width=0,height=0,ratio=1,frame=0,last=0,visible=true,phase=0,px=0,py=0;
  function halo(x,y,rx,ry,stops,tilt=0) {
    ctx.save();ctx.translate(x,y);ctx.rotate(tilt);ctx.scale(rx,ry);
    const grad=ctx.createRadialGradient(0,0,0,0,0,1);
    for(const [position,color] of stops) grad.addColorStop(position,color);
    ctx.fillStyle=grad;ctx.fillRect(-1,-1,2,2);ctx.restore();
  }
  function paint() {
    ctx.setTransform(ratio,0,0,ratio,0,0);ctx.clearRect(0,0,width,height);
    const compact=width<620, cx=width*(compact?.81:.755)+px*5, cy=height*(compact?.60:.53)+py*4;
    const R=compact?Math.min(width*.55,190):Math.min(width*.25,height*1.46,332);
    const tilt=-.22, cos=Math.cos(tilt), sin=Math.sin(tilt);
    ctx.globalAlpha=1;
    halo(cx,cy,R*1.48,R*.60,[[0,'#4254ae5c'],[.45,'#48399d44'],[1,'#35258000']],tilt);
    halo(cx+R*.30,cy-R*.08,R*.93,R*.36,[[0,'#146f9e63'],[.51,'#1857771e'],[1,'#0b305100']],tilt);
    for(const s of sky){
      ctx.globalAlpha=s.a;ctx.fillStyle='#ccd9ff';ctx.fillRect(s.x*width,s.y*height,s.r,s.r);
    }
    const count=compact?1100:stars.length;
    for(let i=0;i<count;i++){
      const s=stars[i],a=s.angle+phase*(.15+.15/(.15+s.radius));
      const rx=Math.cos(a)*s.radius*R, ry=(Math.sin(a)*s.radius*.42+s.lift)*R;
      const x=cx+rx*cos-ry*sin, y=cy+rx*sin+ry*cos;
      ctx.globalAlpha=s.glow*(.85+.15*Math.sin(phase*3+s.phase));
      ctx.fillStyle=colors[s.color];const size=s.size*(compact?.82:1);
      ctx.beginPath();ctx.arc(x,y,size,0,tau);ctx.fill();
      if(s.size>1.77 && i%8===0){ctx.globalAlpha*=.6;ctx.fillRect(x-3.5,y-.4,7,.8);ctx.fillRect(x-.4,y-3.5,.8,7);}
    }
    ctx.globalAlpha=1;
    halo(cx,cy,R*.27,R*.14,[[0,'#e6eaffde'],[.09,'#d5ddffcb'],[.28,'#a09bff7a'],[.65,'#7468ff2c'],[1,'#7161e600']],tilt);
    halo(cx,cy,23,15,[[0,'#fffffff5'],[.13,'#eff6ffcc'],[.5,'#a6baff4a'],[1,'#586eff00']],tilt);
  }
  function resize() {
    width=canvas.clientWidth;height=canvas.clientHeight;if(!width||!height)return;
    ratio=Math.min(devicePixelRatio||1,1.6);
    canvas.width=Math.round(width*ratio);canvas.height=Math.round(height*ratio);paint();
  }
  function tick(time) {
    if(time-last>=40){phase+=Math.min((time-last)/1000,.08)*.14;last=time;paint();}
    frame=requestAnimationFrame(tick);
  }
  function play() {
    cancelAnimationFrame(frame);frame=0;
    if(!document.hidden && visible && !motion.matches){last=performance.now();frame=requestAnimationFrame(tick);}
    else if(width)paint();
  }
  header.addEventListener('pointermove',e=>{
    if(motion.matches || e.pointerType==='touch')return;
    const box=header.getBoundingClientRect();px=(e.clientX-box.left)/box.width-.5;py=(e.clientY-box.top)/box.height-.5;
  });
  header.addEventListener('pointerleave',()=>{px=0;py=0;});
  new ResizeObserver(resize).observe(canvas);
  new IntersectionObserver(([item])=>{visible=item.isIntersecting;play();}).observe(header);
  document.addEventListener('visibilitychange',play);motion.addEventListener('change',play);resize();play();
})();

    const deltaText=d===0?"与基线持平":(d>0?"高于基线 ":"低于基线 ")+M.fmt(Math.abs(d))+" "+M.deltaUnit(c.unit);
    const source=p.source ? "（"+(p.modified?"本地修改的记录，原始出处为 ":"数据来源为 ")+p.source.label+"）":"";
    const text=`在 ${c.name} 上，${b.label} 为 ${valueOf(b.values[i],c.unit)}，${a.label} 为 ${valueOf(a.values[i],c.unit)}，${deltaText}。${source}`;
    try {await navigator.clipboard.writeText(text);notify("已复制对照描述");}
    catch {showDialog("对照描述",area("选中后即可复制","result",text,'readonly rows="4"'),()=>{},"完成");form.elements.result.select();}
  };
  function chartOptions(p,width,height) {
    const {chart}=p, base=p.rows.find(r=>r.id===p.baseline), yCol=p.columns[chart.y];
    const baseY=M.number(base?.values[chart.y]), delta=chart.mode==="delta";
    const points=p.rows.map(r=>{
      const y=M.number(r.values[chart.y]);
      return {id:r.id,label:r.label,x:M.number(r.values[chart.x]),y:delta?difference(y,baseY):y};
    });
    const unit=delta ? M.deltaUnit(yCol.unit) : yCol.unit;
    return {width,height,type:chart.type,points,mode:chart.mode,xLabel:chart.type==="scatter"?fieldName(p.columns[chart.x]):"实验配置",
      yLabel:(delta?"Δ ":"")+yCol.name+(unit?" ("+unit+")":""),title:chart.title||p.title,
      source:p.source ? (p.modified?"本地编辑副本，原始来源":"数据来源")+" · "+p.source.label : "数据来源 · 自建实验记录",
      color:chart.color,grid:chart.grid,showValues:chart.showValues,baselineId:p.baseline,baselineLabel:base?.label||"",
      baselineY:baseY===null?null:(delta?0:baseY),selectedId:p.selected};
  }
  function renderPlot() {
    const p=current(),host=el("plot"); if(!p || !host.clientWidth) return;
    const space=getComputedStyle(host);
    const width=Math.max(220,Math.floor(host.clientWidth-parseFloat(space.paddingLeft)-parseFloat(space.paddingRight)));
    const o=chartOptions(p,width,width<420?225:242);
    host.innerHTML=C.svg(o);
    host.setAttribute("aria-label",o.title+"，"+o.yLabel+"，点击数据标记选择对照记录");
    el("png").disabled=!o.points.some(q=>q.y!==null && (o.type!=="scatter" || q.x!==null));
  }
  function selectRow(id) {
    const p=current(); if(!p || p.selected===id) return;
    editCurrent(exp=>{if(exp.rows.some(r=>r.id===id)) exp.selected=id;});
  }
  el("library").addEventListener("click",e=>{
    const b=e.target.closest("[data-book]"); if(!b) return;
    activeId=b.dataset.book; rememberActive();closeMenu();render();
  });
  el("menu").onclick=()=>{document.body.classList.add("side-open");el("scrim").hidden=false;el("menu").setAttribute("aria-expanded","true");};
  el("scrim").onclick=closeMenu;
  document.addEventListener("keydown",e=>{if(e.key==="Escape")closeMenu();});
  document.querySelectorAll("[data-type]").forEach(b=>b.onclick=()=>editCurrent(p=>{p.chart.type=b.dataset.type;}));
  el("mode").onchange=e=>editCurrent(p=>{p.chart.mode=e.target.value;});
  function chooseAxis(axis,index) {
    editCurrent(p=>{const other=axis==="x"?"y":"x";if(p.chart[other]===index)p.chart[other]=p.chart[axis];p.chart[axis]=index;});
  }
  el("x-axis").onchange=e=>chooseAxis("x",Number(e.target.value));
  el("y-axis").onchange=e=>chooseAxis("y",Number(e.target.value));
  el("comparison-readout").onclick=e=>{const b=e.target.closest("[data-metric]");if(b)chooseAxis("y",Number(b.dataset.metric));};
  el("baseline").onchange=e=>editCurrent(p=>{p.baseline=e.target.value;});
  el("selected").onchange=e=>selectRow(e.target.value);
  el("plot").onclick=e=>{const mark=e.target.closest("[data-row]");if(mark)selectRow(mark.dataset.row);};
  el("plot").onkeydown=e=>{const mark=e.target.closest("[data-row]");if(mark && (e.key==="Enter"||e.key===" ")){e.preventDefault();const id=mark.dataset.row;selectRow(id);el("plot").querySelector('[data-row="'+CSS.escape(id)+'"]')?.focus();}};
  el("tbody").onclick=e=>{
    const b=e.target.closest("button"); if(!b)return;
    if(b.dataset.select) selectRow(b.dataset.select);
    if(b.dataset.edit) rowDialog(b.dataset.edit);
    if(b.dataset.delete) deleteRow(b.dataset.delete);
  };

  const dialog=el("dialog"), form=el("dialog-form"); let submitDialog=null, busy=false;
  function showDialog(title,body,onSubmit,submitLabel="保存") {
    closeMenu();el("dialog-title").textContent=title;el("dialog-body").innerHTML=body;
    el("dialog-error").hidden=true;el("dialog-submit").textContent=submitLabel;el("dialog-submit").disabled=false;
    const previous=form.querySelector(".danger");if(previous)previous.remove();
    submitDialog=onSubmit;busy=false;
    if(!dialog.open)dialog.showModal();
    const input=form.querySelector("#dialog-body input:not([type=checkbox]), #dialog-body textarea");
    if(input)input.focus();
  }
  form.addEventListener("click",e=>{if(e.target.closest("[data-close]")&&!busy)dialog.close();});
  form.onsubmit=async e=>{
    e.preventDefault();if(busy)return;busy=true;el("dialog-submit").disabled=true;el("dialog-error").hidden=true;
    try {await submitDialog(new FormData(form));dialog.close();}
    catch(error){el("dialog-error").textContent=error.message||"保存失败，请重试。";el("dialog-error").hidden=false;}
    finally{busy=false;el("dialog-submit").disabled=false;}
  };
  const textField=(label,name,value="",attrs="")=>`<label class="field">${escape(label)}<input name="${escape(name)}" value="${escape(value)}" ${attrs}></label>`;
  const area=(label,name,value,attrs="")=>`<label class="field">${escape(label)}<textarea name="${escape(name)}" ${attrs}>${escape(value)}</textarea></label>`;
  function newOrEdit(existing) {
    const p=existing||M.blank(""), id=existing?.id;
    const body=textField("实验名称","title",p.title,'required maxlength="100" placeholder="例如：模型组件消融"')+
      area("实验说明","description",p.description||"",'maxlength="500" rows="2"')+
      area("指标与单位","columns",p.columns.map(M.columnHeader).join("\n"),'required rows="4"')+
      '<p class="form-help">每行一个数值指标，例如“准确率 [%]”或“推理时间 [ms]”。已有列按顺序对应，可在末尾追加指标。</p>';
    showDialog(id?"实验设置":"新建实验",body,data=>{
      const title=String(data.get("title")).trim();if(!title)throw Error("请填写实验名称。");
      const columns=String(data.get("columns")).split(/\r?\n/).map(x=>x.trim()).filter(Boolean).map(M.parseColumn);
      if(columns.length<2) throw Error("请至少保留两个数值指标。");
      if(columns.some(c=>!c.name.trim()))throw Error("每项指标都需要名称。");
      if(new Set(columns.map(M.columnHeader)).size!==columns.length)throw Error("指标名称和单位重复，请分别命名。");
      const description=String(data.get("description")).trim();
      if(id)changeExperiment(id,exp=>{
        if(columns.length<exp.columns.length)throw Error("已有指标按列保存。请保留原有列，可在末尾新增。");
        const changed=exp.title!==title || exp.description!==description || JSON.stringify(exp.columns)!==JSON.stringify(columns);
        exp.title=title;exp.description=description;exp.columns=columns;
        for(const r of exp.rows) while(r.values.length<columns.length)r.values.push("");
        if(changed)markChanged(exp);
      });
      else {const exp=M.blank(title);exp.description=description;exp.columns=columns;mutate(state=>{state.experiments.push(exp);activeId=exp.id;});}
    },id?"保存设置":"创建实验");
    if(id){
      const del=document.createElement("button");del.type="button";del.className="button danger";del.textContent="删除实验";
      del.onclick=()=>showDialog("删除这份实验？",`<p>将移除“${escape(p.title)}”及其所有记录。可先导出 CSV 留存。</p>`,()=>{
        mutate(state=>{state.experiments=state.experiments.filter(item=>item.id!==id);});
      },"删除实验");
      form.querySelector(".dialog-foot").prepend(del);
    }
  }
  el("new-book").onclick=el("first-book").onclick=()=>newOrEdit(null);
  el("edit-book").onclick=()=>{if(current())newOrEdit(current());};
  function rowDialog(rowId) {
    const p=current(), old=p.rows.find(r=>r.id===rowId), id=p.id;
    const body=textField("配置名称","label",old?.label||"",'required maxlength="120" placeholder="例如：移除注意力模块"')+
      '<div class="fields">'+p.columns.map((c,i)=>textField(fieldName(c),"v"+i,old?.values[i]||"", 'inputmode="decimal" placeholder="未测可留空"')).join("")+'</div>';
    showDialog(old?"编辑记录":"添加记录",body,data=>{
      const label=String(data.get("label")).trim();if(!label)throw Error("请填写配置名称。");
      const values=p.columns.map((c,i)=>{
        const raw=String(data.get("v"+i)||"").trim();
        if(raw!=="" && M.number(raw)===null)throw Error(c.name+" 需要有限数值，缺测可留空。");
        return raw;
      });
      changeExperiment(id,exp=>{
        if(JSON.stringify(exp.columns)!==JSON.stringify(p.columns))throw Error("指标已在其他窗口修改，请重新打开此表单。");
        if(old){
          const live=exp.rows.find(r=>r.id===old.id);
          if(!live)throw Error("这条记录已被删除。");
          if(live.label!==old.label || JSON.stringify(live.values)!==JSON.stringify(old.values))throw Error("这条记录已在其他窗口更新，请重新打开。");
          if(live.label!==label || JSON.stringify(live.values)!==JSON.stringify(values))markChanged(exp);
          live.label=label;live.values=values;exp.selected=live.id;
        }else{
          const item=M.row(label,values);exp.rows.push(item);if(!exp.baseline)exp.baseline=item.id;exp.selected=item.id;markChanged(exp);
        }
      });
    },old?"保存记录":"添加记录");
  }
  el("add-row").onclick=()=>rowDialog(null);
  function deleteRow(id) {
    const p=current(), item=p.rows.find(r=>r.id===id);if(!item)return;
    showDialog("删除这条记录？",`<p>将从“${escape(p.title)}”移除“${escape(item.label)}”。</p>`,()=>{
      changeExperiment(p.id,exp=>{
        exp.rows=exp.rows.filter(r=>r.id!==id);
        if(exp.baseline===id)exp.baseline=exp.rows[0]?.id||"";
        if(exp.selected===id)exp.selected=exp.rows.find(r=>r.id!==exp.baseline)?.id||exp.baseline;
        markChanged(exp);
      });
    },"删除记录");
  }
  el("import-book").onclick=()=>{
    const body=textField("实验名称（可选）","title","",'maxlength="100" placeholder="默认使用文件名"')+
      '<label class="field">CSV 文件<input type="file" name="file" accept=".csv,text/csv"></label>'+
      area("或直接粘贴 CSV","text","",'rows="4" placeholder="配置名称,训练时间 [h],准确率 [%]"')+
      '<p class="form-help">首列是配置名称，后面至少两列数值指标。空白表示缺测，导入后会新建一份实验。</p>';
    showDialog("从 CSV 新建实验",body,async data=>{
      const file=data.get("file"),typed=String(data.get("text")).trim();
      if(file?.name && typed)throw Error("请选择文件或粘贴文本其中一种。");
      if(!file?.name && !typed)throw Error("请选择 CSV 文件或粘贴数据。");
      const raw=file?.name?await file.text():typed;
      const name=String(data.get("title")).trim()||file?.name?.replace(/\.csv$/i,"")||"导入的实验";
      const exp=M.fromCSV(raw,name);mutate(state=>{state.experiments.push(exp);activeId=exp.id;});notify("已导入 "+exp.rows.length+" 条记录");
    },"导入实验");
  };
  el("style-chart").onclick=()=>{
    const p=current(),c=p.chart;
    const body=textField("图表标题","title",c.title,'maxlength="100" placeholder="默认使用实验名称导出"')+
      textField("图表配色","color",c.color,'type="color"')+
      `<label class="check"><input type="checkbox" name="grid" ${c.grid?"checked":""}>显示网格线</label><label class="check"><input type="checkbox" name="values" ${c.showValues?"checked":""}>显示数据标签</label>`;
    showDialog("图表样式",body,data=>changeExperiment(p.id,exp=>{
      Object.assign(exp.chart,{title:String(data.get("title")).trim(),color:String(data.get("color")),grid:data.has("grid"),showValues:data.has("values")});
    }));
  };
  function saveFile(blob,name) {
    const url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=name.replace(/[\\/:*?"<>|\r\n]/g,"_");
    document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000);
  }
  el("backup-book").onclick=()=>{
    saveFile(new Blob([JSON.stringify(book,null,2)],{type:"application/json;charset=utf-8"}),"LabPlot-实验册备份.json");
    notify("已导出完整实验册");
  };
  el("restore-book").onclick=()=>{
    showDialog("恢复实验册",'<label class="field">选择实验册备份文件<input type="file" name="file" accept=".json,application/json" required></label><p class="form-help">恢复将替换当前浏览器中的全部实验。请先备份当前实验册。</p>',async data=>{
      const file=data.get("file");
      if(!file?.name)throw Error("请选择实验册备份文件。");
      let restored;
      try { restored=unpack(await file.text()); }
      catch { throw Error("文件不是有效的 LabPlot 实验册备份。当前实验未改变。"); }
      try { localStorage.setItem(BOOK,JSON.stringify(restored)); }
      catch { throw Error("浏览器无法保存恢复的数据，当前实验未改变。"); }
      book=restored;dirty=false;pendingRecovery=false;warning="";activeId=book.experiments[0]?.id||"";
      rememberActive();render();notify("已恢复 "+book.experiments.length+" 份实验");
    },"替换并恢复");
  };
  el("csv").onclick=()=>{const p=current();if(p)saveFile(new Blob([M.csv(p)],{type:"text/csv;charset=utf-8"}),p.title+".csv");};
  el("png").onclick=async()=>{
    const p=current();if(!p)return;
    try {const blob=await C.png(chartOptions(p,1600,900));saveFile(blob,p.title+"-"+p.columns[p.chart.y].name+".png");}
    catch(error){notify("PNG 导出失败："+(error.message||"请重试"));}
  };
  window.addEventListener("storage",event=>{
    if(event.key!==BOOK || dirty) return;
    try {
      if(event.newValue!==null)book=unpack(event.newValue);
      else {warning="浏览器中的实验册已被清除。可将页面中的数据导出备份。";dirty=true;}
      normalizeActive();render();
    }catch{warning="其他窗口的实验册格式异常，请先导出当前记录。";dirty=true;render();}
  });
  normalizeActive();render();new ResizeObserver(renderPlot).observe(el("plot"));
})();

</script>
</body>
</html>
